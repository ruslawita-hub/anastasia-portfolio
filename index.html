
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Anastasia Lekontseva | Photography & Films</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #222222;
      color: #cccccc;
      font-family: Arial, sans-serif;
    }

    /* HEADER */
    header {
      padding: 20px 25px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #444444;
      padding-bottom: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 3px;
      margin: 0;
    }

    /* MENU */
    nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    nav a {
      color: #aaaaaa;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    nav a:hover {
      color: white;
    }

    /* HOME */
    main {
      padding: 55px 25px;
    }

    .subtitle {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 45px;
    }

    /* GALLERIA */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 35px;
    }

    .photo {
      background-color: #333333;
      aspect-ratio: 3 / 2;
    }

    /* SMARTPHONE */
    @media (max-width: 768px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .logo {
        font-size: 19px;
      }

      nav {
        flex-wrap: wrap;
        gap: 16px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-top">

      <h1 class="logo">ANASTASIA LEKONTSEVA</h1>

      <nav>
        <a href="#">HOME</a>
        <a href="#">PORTFOLIO</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
        <a href="#">EN ▾</a>
      </nav>

    </div>
  </header>

  <main>

    <p class="subtitle">
      PHOTOGRAPHER, VIDEOGRAPHER & MULTIMEDIA DESIGNER
    </p>

    <div class="gallery">
      <div class="photo"></div>
      <div class="photo"></div>
      <div class="photo"></div>
      <div class="photo"></div>
    </div>

  </main>

</body>
</html>
